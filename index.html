<body>
    <div class="quiz-container">
        <!-- Логотип сайта -->
        <div class="logo-container">
            <img src="favicon.png" alt="Логотип SiteEdu" class="logo">
        </div>

        <h1>📚 Тесты для 7 класса</h1>

        <!-- 🔹 Экран регистрации/входа 🔹 -->
        <div id="auth-screen">
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Вход 🔑</button>
                <button class="auth-tab" data-tab="register">Регистрация ✍️</button>
            </div>
            
            <!-- Форма входа -->
            <div id="login-form" class="auth-form">
                <div class="input-group">
                    <label for="login-username">👤 Имя пользователя:</label>
                    <input type="text" id="login-username" placeholder="Введите ваше имя">
                </div>
                <button id="login-btn" class="btn-primary">Войти 🚀</button>
            </div>
            
            <!-- Форма регистрации -->
            <div id="register-form" class="auth-form hidden">
                <div class="input-group">
                    <label for="register-username">👤 Придумайте имя:</label>
                    <input type="text" id="register-username" placeholder="Ваше имя">
                </div>
                <div class="input-group">
                    <label for="register-email">📧 Email (обязательно для рейтинга):</label>
                    <input type="email" id="register-email" placeholder="example@mail.ru">
                </div>
                <button id="register-btn" class="btn-primary">Зарегистрироваться ✨</button>
            </div>
            
            <div id="auth-message" class="auth-message"></div>
        </div>

        <!-- 🔹 Экран выбора предмета 🔹 -->
        <div id="start-screen" class="hidden">
            <div class="user-info">
                <div class="user-details">
                    <span class="user-greeting">👋 Привет, <span id="display-username">Гость</span>!</span>
                    <span class="user-points">🏆 Очки: <span id="display-points">0</span></span>
                </div>
                <div class="user-actions">
                    <button id="leaderboard-btn" class="btn-small btn-info">📊 Рейтинг</button>
                    <button id="logout-btn" class="btn-small">Выйти 🚪</button>
                </div>
            </div>
            
            <div class="selection">
                <div class="input-group">
                    <label for="subject">📖 Предмет:</label>
                    <select id="subject">
                        <option value="" disabled selected>Выберите предмет</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="topic">📝 Тема:</label>
                    <select id="topic" disabled>
                        <option value="" disabled selected>Сначала выберите предмет</option>
                    </select>
                </div>
            </div>
            <button id="start-btn" class="btn-primary">Начать тест 🚀</button>
        </div>

        <!-- 🔹 Экран викторины 🔹 -->
        <div id="quiz-area" class="hidden">
            <div class="user-progress">
                <span id="quiz-username"></span>
                <span class="progress-divider">|</span>
                <span>🏆 Очки: <span id="quiz-points">0</span></span>
                <span class="progress-divider">|</span>
                <span>Вопрос <span id="current-num">1</span> из <span id="total-num">10</span></span>
            </div>
            
            <div id="question-box"></div>
            <div id="options-box"></div>
            <div id="result-message"></div>
            <div id="explanation-box" class="hidden"></div>
            <div id="points-change" class="points-change hidden"></div>
            <button id="submit-btn" class="btn-primary hidden">Ответить ✅</button>
            <button id="next-btn" class="btn-secondary hidden">Следующий вопрос ➡️</button>
        </div>

        <!-- 🔹 Экран результатов 🔹 -->
        <div id="end-screen" class="hidden">
            <div class="result-circle">
                <span id="final-score"></span>
            </div>
            <h2>Тест завершен!</h2>
            <p id="final-message"></p>
            <p id="user-final-message" class="user-final-message"></p>
            <div class="points-summary">
                <p>🎯 Заработано очков: <span id="points-earned">0</span></p>
                <p>💰 Всего очков: <span id="total-points">0</span></p>
            </div>
            <button id="restart-btn" class="btn-primary">Пройти ещё раз 🔄</button>
            <button id="back-to-menu-btn" class="btn-secondary">В меню 📋</button>
        </div>

        <!-- 🔹 Экран рейтинга 🔹 -->
        <div id="leaderboard-screen" class="hidden">
            <h2>🏆 Таблица лидеров</h2>
            <p class="leaderboard-subtitle">Только пользователи с подтверждённым email</p>
            <div class="leaderboard-container">
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>🥇 Место</th>
                            <th>👤 Имя</th>
                            <th>🏆 Очки</th>
                            <th>📊 Тестов</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <!-- Данные заполняются через JS -->
                    </tbody>
                </table>
            </div>
            <div id="user-rank" class="user-rank hidden"></div>
            <button id="back-from-leaderboard-btn" class="btn-primary">Назад 📋</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
